# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false

reviews:
  profile: chill            # "chill" = fewer, higher-signal comments; "assertive" = more nitpicks
  request_changes_workflow: true   # CodeRabbit posts a formal "Request changes" review that must be resolved
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false           # set true to also review draft PRs
    base_branches:
      - "main"
      - "dev"
      - "backend/.*"
      - "frontend/.*"

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/build/**"

chat:
  auto_reply: true
